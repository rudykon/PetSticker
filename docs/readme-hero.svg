  <path d="M257 193q39 24 78 0" fill="none" stroke="#2F8F83" stroke-width="11" stroke-linecap="round"/>
  <circle cx="296" cy="207" r="15" fill="#FEBD08" stroke="#1F2A44" stroke-width="4"/>

