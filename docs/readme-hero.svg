  <path d="M1096 48v20M1086 58h20" stroke="#2F8F83" stroke-width="5" stroke-linecap="round" opacity=".55"/>

  <!-- One coherent chat canvas: source pet on the left, sticker collection on the right. -->
  <rect x="86" y="42" width="1028" height="228" rx="42" fill="#1F2A44"/>
  <path d="M154 260l-26 38 72-32" fill="#1F2A44"/>

